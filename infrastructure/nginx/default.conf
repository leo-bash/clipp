upstream shortfactory_dashboard { server dashboard:3000; }
upstream shortfactory_api { server api:4000; }

server {
  listen 80;
  server_name _;

  location /api/ {
    proxy_pass http://shortfactory_api;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
  }

  location / {
    proxy_pass http://shortfactory_dashboard;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
