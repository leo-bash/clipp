name: shortfactory

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: shortfactory
      POSTGRES_USER: shortfactory
      POSTGRES_PASSWORD: shortfactory
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortfactory -d shortfactory"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["pnpm", "--filter", "@shortfactory/api", "dev"]
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://shortfactory:shortfactory@postgres:5432/shortfactory
      QUEUE_MODE: redis
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
      database-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  database-migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["sh", "-c", "pnpm --filter @shortfactory/database db:migrate && pnpm --filter @shortfactory/database db:seed"]
    environment:
      NODE_ENV: development
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://shortfactory:shortfactory@postgres:5432/shortfactory
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["pnpm", "--filter", "@shortfactory/dashboard", "dev"]
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  worker-light:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["pnpm", "--filter", "@shortfactory/worker-light", "dev"]
    environment:
      NODE_ENV: development
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://shortfactory:shortfactory@postgres:5432/shortfactory
      QUEUE_MODE: redis
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  worker-render:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["pnpm", "--filter", "@shortfactory/worker-render", "dev"]
    environment:
      NODE_ENV: development
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://shortfactory:shortfactory@postgres:5432/shortfactory
      QUEUE_MODE: redis
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  publisher-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["pnpm", "--filter", "@shortfactory/publisher-worker", "dev"]
    environment:
      NODE_ENV: development
      QUEUE_MODE: redis
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      dashboard:
        condition: service_started
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
