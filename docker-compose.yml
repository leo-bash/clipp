name: shortfactory

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: shortfactory
      POSTGRES_USER: shortfactory
      POSTGRES_PASSWORD: shortfactory
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortfactory -d shortfactory"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["pnpm", "--filter", "@shortfactory/api", "dev"]
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://shortfactory:shortfactory@postgres:5432/shortfactory
      QUEUE_MODE: redis
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
      database-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  database-migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["sh", "-c", "pnpm --filter @shortfactory/database db:migrate && pnpm --filter @shortfactory/database db:seed"]
    environment:
      NODE_ENV: development
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://shortfactory:shortfactory@postgres:5432/shortfactory
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["pnpm", "--filter", "@shortfactory/dashboard", "dev"]
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  worker-light:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["pnpm", "--filter", "@shortfactory/worker-light", "dev"]
    environment:
      NODE_ENV: development
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://shortfactory:shortfactory@postgres:5432/shortfactory
      QUEUE_MODE: redis
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      database-migrate:
        condition: service_completed_successfully

  discovery-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["pnpm", "--filter", "@shortfactory/discovery-worker", "dev"]
    environment:
      NODE_ENV: development
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://shortfactory:shortfactory@postgres:5432/shortfactory
      QUEUE_MODE: redis
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      database-migrate:
        condition: service_completed_successfully

  transcription-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["pnpm", "--filter", "@shortfactory/transcription-worker", "dev"]
    environment:
      NODE_ENV: development
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://shortfactory:shortfactory@postgres:5432/shortfactory
      QUEUE_MODE: redis
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      database-migrate:
        condition: service_completed_successfully

  tts-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["pnpm", "--filter", "@shortfactory/tts-worker", "dev"]
    environment:
      NODE_ENV: development
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://shortfactory:shortfactory@postgres:5432/shortfactory
      QUEUE_MODE: redis
      REDIS_URL: redis://redis:6379
      TTS_PROVIDER: ${TTS_PROVIDER:-disabled}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_VOICE_ID: ${TTS_VOICE_ID:-}
      TTS_MODEL_ID: ${TTS_MODEL_ID:-eleven_multilingual_v2}
      TTS_OUTPUT_FORMAT: ${TTS_OUTPUT_FORMAT:-mp3_44100_128}
      TTS_OUTPUT_ROOT: /app/.data/tts
      TTS_COST_PER_1000_CHARS_EUR: ${TTS_COST_PER_1000_CHARS_EUR:-0.30}
    depends_on:
      redis:
        condition: service_healthy
      database-migrate:
        condition: service_completed_successfully

  analysis-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["pnpm", "--filter", "@shortfactory/analysis-worker", "dev"]
    environment:
      NODE_ENV: development
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://shortfactory:shortfactory@postgres:5432/shortfactory
      QUEUE_MODE: redis
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      database-migrate:
        condition: service_completed_successfully

  script-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["pnpm", "--filter", "@shortfactory/script-worker", "dev"]
    environment:
      NODE_ENV: development
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://shortfactory:shortfactory@postgres:5432/shortfactory
      QUEUE_MODE: redis
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      database-migrate:
        condition: service_completed_successfully

  worker-render:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["pnpm", "--filter", "@shortfactory/worker-render", "dev"]
    environment:
      NODE_ENV: development
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://shortfactory:shortfactory@postgres:5432/shortfactory
      QUEUE_MODE: redis
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      database-migrate:
        condition: service_completed_successfully

  qc-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["pnpm", "--filter", "@shortfactory/qc-worker", "dev"]
    environment:
      NODE_ENV: development
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://shortfactory:shortfactory@postgres:5432/shortfactory
      QUEUE_MODE: redis
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      database-migrate:
        condition: service_completed_successfully

  review-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["pnpm", "--filter", "@shortfactory/review-worker", "dev"]
    environment:
      NODE_ENV: development
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://shortfactory:shortfactory@postgres:5432/shortfactory
      QUEUE_MODE: redis
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      database-migrate:
        condition: service_completed_successfully

  publisher-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["pnpm", "--filter", "@shortfactory/publisher-worker", "dev"]
    environment:
      NODE_ENV: development
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://shortfactory:shortfactory@postgres:5432/shortfactory
      QUEUE_MODE: redis
      REDIS_URL: redis://redis:6379
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI:-}
      YOUTUBE_ACCESS_TOKEN: ${YOUTUBE_ACCESS_TOKEN:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN:-}
      TIKTOK_OPEN_ID: ${TIKTOK_OPEN_ID:-}
      TIKTOK_MODE: ${TIKTOK_MODE:-UPLOAD_DRAFT}
      TIKTOK_FALLBACK_TO_DRAFT: ${TIKTOK_FALLBACK_TO_DRAFT:-true}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      INSTAGRAM_USER_ID: ${INSTAGRAM_USER_ID:-}
      INSTAGRAM_API_VERSION: ${INSTAGRAM_API_VERSION:-v23.0}
    depends_on:
      redis:
        condition: service_healthy
      database-migrate:
        condition: service_completed_successfully

  analytics-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["pnpm", "--filter", "@shortfactory/analytics-worker", "dev"]
    environment:
      NODE_ENV: development
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://shortfactory:shortfactory@postgres:5432/shortfactory
      QUEUE_MODE: redis
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      database-migrate:
        condition: service_completed_successfully

  cleanup-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["pnpm", "--filter", "@shortfactory/cleanup-worker", "dev"]
    environment:
      NODE_ENV: development
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://shortfactory:shortfactory@postgres:5432/shortfactory
      QUEUE_MODE: redis
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      database-migrate:
        condition: service_completed_successfully

  orchestrator-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ["pnpm", "--filter", "@shortfactory/orchestrator-worker", "dev"]
    environment:
      NODE_ENV: development
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://shortfactory:shortfactory@postgres:5432/shortfactory
      QUEUE_MODE: redis
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      database-migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      dashboard:
        condition: service_started
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
